services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatbook
      POSTGRES_USER: seatbook
      POSTGRES_PASSWORD: seatbook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbook -d seatbook"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/seatbook
      SPRING_DATASOURCE_USERNAME: seatbook
      SPRING_DATASOURCE_PASSWORD: seatbook
    ports:
      - "8080:8080"
