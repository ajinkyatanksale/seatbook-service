server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-connections: 30000     # default 8192 would refuse part of a 20k burst
    accept-count: 10000

spring:
  application:
    name: seatbook
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seatbook}
    username: ${SPRING_DATASOURCE_USERNAME:seatbook}
    password: ${SPRING_DATASOURCE_PASSWORD:seatbook}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  logging:
    level:
      org.flywaydb: DEBUG

  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      accept-float-as-int: false

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: seatbook
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

logging:
  structured:
    format:
      console: ecs

app:
  admin-token: ${ADMIN_TOKEN:admin-token}
  booking:
    max-concurrent: 24
